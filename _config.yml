title: Sovereign Intellect
tagline: Essays on intellectual sovereignty and open science
description: >-
  A blog on intellectual sovereignty, open science, provenance, and the
  evaluation of independent researchers in the AI era.
url: "https://pravinkumar-ghodake.github.io"
baseurl: "/sovereign-intellect-blog"
lang: en
timezone: UTC
future: true

author:
  name: Pravinkumar Ghodake
  url: "https://pravinkumar-ghodake.github.io/sovereign-intellect-blog/about/"

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge

collections:
  series:
    output: true
    permalink: /series/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
  - scope:
      path: ""
      type: series
    values:
      layout: series

exclude:
  - README.md
  - LICENSE
  - LICENSE-PROSE
