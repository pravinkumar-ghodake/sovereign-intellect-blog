{% if page.url == "/about/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": {{ site.author.entity_id | jsonify }},
  "name": {{ site.author.full_name | default: site.author.name | jsonify }},
  "alternateName": {{ site.author.name | jsonify }},
  "url": {{ site.author.url | jsonify }},
  "identifier": {
    "@type": "PropertyValue",
    "propertyID": "ORCID",
    "value": {{ site.author.orcid | jsonify }}
  },
  "sameAs": {{ site.social.links | jsonify }},
  "knowsAbout": [
    "Solid mechanics",
    "Computational mechanics",
    "Nonlinear ultrasonics",
    "Wave propagation",
    "Metamaterials",
    "Inverse problems",
    "Structural health monitoring",
    "Acoustics"
  ],
  "mainEntityOfPage": {{ page.url | absolute_url | jsonify }}
}
</script>

{% elsif page.layout == "series" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }}
}
</script>
{% endif %}
