{% if page.url == "/about/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": {{ site.identity.person_id | jsonify }},
  "name": {{ site.identity.name | jsonify }},
  "alternateName": {{ site.identity.alternate_name | jsonify }},
  "givenName": "Pravinkumar",
  "familyName": "Ghodake",
  "url": {{ site.identity.url | jsonify }},
  "identifier": {
    "@type": "PropertyValue",
    "propertyID": "ORCID",
    "value": {{ site.identity.orcid | jsonify }}
  },
  "sameAs": {{ site.identity.same_as | jsonify }},
  "knowsAbout": {{ site.identity.knows_about | jsonify }},
  "subjectOf": [
    {% for subject_url in site.identity.subject_of %}
    {
      "@type": "WebPage",
      "@id": {{ subject_url | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ],
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ page.url | absolute_url | jsonify }}
  }
}
</script>

{% elsif page.layout == "series" %}
  {% assign series_slug = page.series_slug | default: page.slug | default: page.series %}
  {% assign s = site.data.series | where: "slug", series_slug | first %}

  {% if s and s.parts %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "@id": {{ page.url | absolute_url | jsonify }},
  "name": {{ page.title | default: s.title | jsonify }},
  "description": {{ page.description | default: s.description | default: site.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "mainEntity": {
    "@type": "ItemList",
    "numberOfItems": {{ s.parts.size }},
    "itemListElement": [
      {% for part in s.parts %}
      {
        "@type": "ListItem",
        "position": {{ part.number | default: forloop.index }},
        "name": {{ part.title | jsonify }},
        "url": {{ part.url | absolute_url | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }
}
</script>
  {% endif %}
{% endif %}
